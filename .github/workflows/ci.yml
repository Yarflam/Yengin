name: CI

on:
    push:
        branches:
            - 'claude/**'
            - 'next-v3**'
            - 'dev'
            - 'master'
            - 'main'
    pull_request:
        branches:
            - 'next-v3**'
            - 'dev'
            - 'master'
            - 'main'

jobs:
    test:
        name: Test on Node.js ${{ matrix.node-version }}
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: ['16.10', '18', '20', '22']

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Generate coverage report
              if: matrix.node-version == '20'
              run: npm run test:coverage

            - name: Upload coverage to Codecov
              if: matrix.node-version == '20'
              uses: codecov/codecov-action@v3
              with:
                  files: ./coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

    lint:
        name: Code Quality
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check formatting
              run: npx prettier --check "src/**/*.mjs"

    build-check:
        name: Build Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Verify package.json
              run: npm run lint

            - name: Check for syntax errors
              run: node -c src/index.mjs
